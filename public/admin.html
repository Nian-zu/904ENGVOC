<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>成績後台｜會考英文每日測驗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* same blackboard palette as the student page; dense table layout for scanning */
  --board:#1f3d33; --chalk:#f2c94c; --paper:#f6f5f0; --card:#fff; --ink:#1c2321; --muted:#5f6b67; --line:#dde3df;
  --ok:#1f8a4c; --ok-bg:#e5f5ec; --warn:#b7791f; --warn-bg:#fdf3dc; --bad:#c2412d; --bad-bg:#fbe9e5;
  --font:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
header{background:var(--board);color:#f4f1e6;padding:14px 20px}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.2rem;font-weight:900;letter-spacing:.04em}
.wrap{max-width:1100px;margin:0 auto}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.btn{background:var(--board);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.ghost.on{background:var(--board);color:#fff;border-color:var(--board)}
.muted{color:var(--muted);font-size:.88rem}
.err{color:var(--bad);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card)}
.tile .n{font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:.85rem}
h2{font-size:1.05rem;margin:0 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{font-size:.85rem;color:var(--muted);font-weight:700;background:var(--paper);position:sticky;top:0;cursor:pointer}
td.num,th.num{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.seat{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.85rem}
.seat b{font-size:1rem}
.seat.none{background:var(--bad-bg);border-color:#efc2b8}
.seat.done{background:var(--ok-bg);border-color:#b9e2c8}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--paper)}
.words span b{color:var(--bad);margin-left:4px}
.hidden{display:none !important}
.del{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:0}
</style>
</head>
<body>
<header><div class="wrap"><h1>成績後台｜會考英文每日測驗</h1><span id="who" class="muted" style="color:#d7dfd9"></span></div></header>
<main><div class="wrap">

<section class="card" id="login">
  <h2>老師登入</h2>
  <form class="row" id="loginForm">
    <label for="pw">後台密碼</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="btn" type="submit">登入</button>
  </form>
  <p class="muted">密碼是你在 Netlify 設定的環境變數 ADMIN_PASSWORD。</p>
  <p class="err" id="loginErr"></p>
</section>

<div id="app" class="hidden">
  <section class="card">
    <div class="row">
      <label for="from">日期</label><input type="date" id="from">
      <label for="to">到</label><input type="date" id="to">
      <button class="ghost" data-q="today">今天</button>
      <button class="ghost" data-q="7">最近 7 天</button>
      <button class="ghost" data-q="30">最近 30 天</button>
      <button class="btn" id="load">查詢</button>
      <label for="size" class="muted">班級人數</label><input type="number" id="size" min="1" max="60" value="28" style="width:70px">
      <button class="ghost" id="csv">下載 CSV</button>
      <span class="muted" id="status"></span>
    </div>
  </section>

  <section class="tiles" id="tiles"></section>

  <section class="card" style="margin-top:14px">
    <div class="tabs">
      <button class="ghost on" data-tab="seats">交卷狀況</button>
      <button class="ghost" data-tab="students">個人統計</button>
      <button class="ghost" data-tab="records">所有紀錄</button>
      <button class="ghost" data-tab="words">最常錯的字</button>
    </div>
    <div id="tab-seats"><div class="seatgrid" id="seatGrid"></div><p class="muted">紅色：所選日期內沒有交卷；綠色：有交卷（顯示最佳分數與次數）。</p></div>
    <div id="tab-students" class="hidden tblwrap"><table id="stuTbl"></table></div>
    <div id="tab-records" class="hidden">
      <div class="row" style="margin-bottom:8px"><label for="seatFilter">只看座號</label><select id="seatFilter"><option value="">全部</option></select></div>
      <div class="tblwrap"><table id="recTbl"></table></div>
    </div>
    <div id="tab-words" class="hidden"><div class="words" id="wordList"></div><p class="muted">所選日期內全班答錯次數最多的字（數字為次數），可以挑出來隔天複習。</p></div>
  </section>
</div>

</div></main>
<script>
const $ = id => document.getElementById(id);
let PW = '', RECS = [];
const twToday = () => new Date(Date.now() + 8*3600e3).toISOString().slice(0,10);
const addDays = (d, n) => new Date(new Date(d + 'T00:00:00Z').getTime() + n*86400e3).toISOString().slice(0,10);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime = iso => new Date(iso).toLocaleString('zh-TW', {timeZone:'Asia/Taipei', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false});
const fmtDur = s => s >= 60 ? `${Math.floor(s/60)} 分 ${s%60} 秒` : `${s} 秒`;
const pill = sc => `<span class="pill ${sc >= 85 ? 'p-ok' : sc >= 60 ? 'p-warn' : 'p-bad'}">${sc}</span>`;

async function api(path, opts = {}) {
  const r = await fetch(path, {...opts, headers: {'x-admin-password': PW, ...(opts.headers || {})}});
  const j = await r.json().catch(() => ({ok:false, error:'伺服器回應錯誤'}));
  if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); PW = $('pw').value; $('loginErr').textContent = '';
  try {
    $('from').value = $('to').value = twToday();
    await load();
    try { sessionStorage.setItem('pw', PW); } catch (e) {}
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  } catch (err) { $('loginErr').textContent = err.message; }
});

async function load() {
  $('status').textContent = '讀取中…';
  const j = await api(`/api/results?from=${$('from').value}&to=${$('to').value}`);
  RECS = j.records;
  $('status').textContent = `${j.from} 到 ${j.to}，共 ${j.count} 筆`;
  render();
}
$('load').onclick = () => load().catch(e => $('status').textContent = e.message);
document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
  const t = twToday(), q = b.dataset.q;
  $('to').value = t; $('from').value = q === 'today' ? t : addDays(t, -(+q - 1));
  $('load').click();
});
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  ['seats','students','records','words'].forEach(t => $('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
});
$('size').onchange = render;
$('seatFilter').onchange = renderRecords;

function bySeat() {
  const m = new Map();
  for (const r of RECS) {
    if (!m.has(r.seat)) m.set(r.seat, {seat: r.seat, names: new Set(), n: 0, sum: 0, best: 0, q: 0, right: 0, last: ''});
    const s = m.get(r.seat);
    s.names.add(r.name); s.n++; s.sum += r.score; s.best = Math.max(s.best, r.score);
    s.q += r.answered; s.right += r.right; if (r.time > s.last) s.last = r.time;
  }
  return m;
}

function render() {
  const size = +$('size').value || 28, m = bySeat();
  const avg = RECS.length ? Math.round(RECS.reduce((a, r) => a + r.score, 0) / RECS.length) : 0;
  const done = [...m.keys()].filter(k => k >= 1 && k <= size).length;
  $('tiles').innerHTML = [
    ['交卷人數', `${done} / ${size}`],
    ['測驗次數', RECS.length],
    ['平均分數', RECS.length ? avg : '—'],
    ['總作答題數', RECS.reduce((a, r) => a + r.answered, 0)]
  ].map(([l, n]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  // seats
  let g = '';
  for (let i = 1; i <= size; i++) {
    const s = m.get(i);
    g += s ? `<div class="seat done"><b>${i}</b> ${esc([...s.names][0])}<br>最佳 ${s.best}・${s.n} 次</div>`
           : `<div class="seat none"><b>${i}</b><br>未交</div>`;
  }
  $('seatGrid').innerHTML = g;

  // students table
  const rows = [...m.values()].sort((a, b) => a.seat - b.seat);
  $('stuTbl').innerHTML = `<thead><tr><th class="num">座號</th><th>姓名</th><th class="num">測驗次數</th><th class="num">平均分數</th><th class="num">最佳</th><th class="num">總答對率</th><th>最後交卷</th></tr></thead><tbody>` +
    rows.map(s => `<tr><td class="num">${s.seat}</td><td>${esc([...s.names].join('／'))}</td><td class="num">${s.n}</td><td class="num">${pill(Math.round(s.sum / s.n))}</td><td class="num">${s.best}</td><td class="num">${s.q ? Math.round(s.right / s.q * 100) : 0}%</td><td>${fmtTime(s.last)}</td></tr>`).join('') + '</tbody>';

  // seat filter
  const cur = $('seatFilter').value;
  $('seatFilter').innerHTML = '<option value="">全部</option>' + rows.map(s => `<option value="${s.seat}">${s.seat} 號 ${esc([...s.names][0])}</option>`).join('');
  $('seatFilter').value = cur;
  renderRecords();

  // words
  const wc = new Map();
  RECS.forEach(r => (r.wrong || []).forEach(w => wc.set(w, (wc.get(w) || 0) + 1)));
  const top = [...wc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 40);
  $('wordList').innerHTML = top.length ? top.map(([w, n]) => `<span>${esc(w)}<b>${n}</b></span>`).join('') : '<span>所選日期內沒有答錯紀錄</span>';
}

function renderRecords() {
  const f = $('seatFilter').value;
  const list = RECS.filter(r => !f || String(r.seat) === f);
  $('recTbl').innerHTML = `<thead><tr><th>交卷時間</th><th class="num">座號</th><th>姓名</th><th>範圍</th><th class="num">答對／作答</th><th class="num">分數</th><th class="num">用時</th><th>狀態</th><th></th></tr></thead><tbody>` +
    list.map(r => `<tr><td>${fmtTime(r.time)}</td><td class="num">${r.seat}</td><td>${esc(r.name)}</td><td>${esc(r.range)}</td><td class="num">${r.right} / ${r.answered}</td><td class="num">${pill(r.score)}</td><td class="num">${fmtDur(r.seconds)}</td><td>${r.finished ? '完成' : `<span class="pill p-warn">中途結束（${r.answered}/${r.total}）</span>`}</td><td><button class="del" data-id="${esc(r.id)}">刪除</button></td></tr>`).join('') + '</tbody>';
  $('recTbl').querySelectorAll('.del').forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = '確定刪除？'; return; }
    try { await api('/api/results?id=' + encodeURIComponent(b.dataset.id), {method: 'DELETE'}); RECS = RECS.filter(r => r.id !== b.dataset.id); render(); }
    catch (e) { b.textContent = '刪除失敗'; }
  });
}

$('csv').onclick = () => {
  const head = ['日期','交卷時間','座號','姓名','範圍','題數','作答','答對','分數','用時(秒)','完成','答錯的字'];
  const rows = RECS.slice().sort((a, b) => a.seat - b.seat || (a.time < b.time ? -1 : 1)).map(r =>
    [r.date, fmtTime(r.time), r.seat, r.name, r.range, r.total, r.answered, r.right, r.score, r.seconds, r.finished ? '是' : '否', (r.wrong || []).join(' ')]);
  const csv = '﻿' + [head, ...rows].map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
  a.download = `成績_${$('from').value}_${$('to').value}.csv`; a.click();
};

// auto-login within the same tab session
try { const p = sessionStorage.getItem('pw'); if (p) { $('pw').value = p; $('loginForm').requestSubmit(); } } catch (e) {}
</script>
</body>
</html>
