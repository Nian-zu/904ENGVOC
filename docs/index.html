<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永中904每日背英單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* classroom blackboard + chalk: deep green board, chalk-yellow accent, paper surfaces */
  --board:#1f3d33; --board-2:#2a5245; --chalk:#f2c94c; --paper:#fbfaf6; --card:#ffffff;
  --ink:#1c2321; --muted:#5f6b67; --line:#dde3df;
  --ok:#1f8a4c; --ok-bg:#e5f5ec; --bad:#c2412d; --bad-bg:#fbe9e5;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-en:'Atkinson Hyperlegible','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#15291f; --board-2:#1f3b2f; --chalk:#f2c94c; --paper:#121715; --card:#1a201e;
    --ink:#e9eeec; --muted:#9aa8a3; --line:#2c3633; --ok:#4cc27e; --ok-bg:#16301f; --bad:#ef7a64; --bad-bg:#3a1c16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --board:#15291f; --board-2:#1f3b2f; --chalk:#f2c94c; --paper:#121715; --card:#1a201e;
  --ink:#e9eeec; --muted:#9aa8a3; --line:#2c3633; --ok:#4cc27e; --ok-bg:#16301f; --bad:#ef7a64; --bad-bg:#3a1c16; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
header.top{background:var(--board);color:#f4f1e6;padding:18px 20px 16px}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.04em;text-wrap:balance}
header.top .today{font-size:.95rem;color:#d7dfd9}
header.top .today b{color:var(--chalk);font-size:1.15rem;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto}
main{padding:18px 16px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:18px}
.field{display:grid;gap:8px}
.label{font-weight:700;font-size:.95rem}
.hint{color:var(--muted);font-size:.85rem}
.seg{justify-self:start;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--paper);flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--board);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
input[type=text]{flex:1;min-width:200px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1px dashed var(--board-2);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;font-size:.9rem}
.quick button[aria-pressed="true"]{background:var(--chalk);border:1px solid var(--chalk);color:#2a2410;font-weight:700}
.rangeNow{font-size:.9rem;color:var(--muted)}
.rangeNow b{color:var(--ink);font-variant-numeric:tabular-nums}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;max-height:220px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.daygrid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 0;font-size:.85rem;font-variant-numeric:tabular-nums}
.daygrid button[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:#2a2410;font-weight:700}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.summary .count{font-variant-numeric:tabular-nums}
.summary .count b{font-size:1.3rem}
.primary{background:var(--board);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:500}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chip{display:inline-block;background:var(--board);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip.k{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.bar span{display:block;height:100%;background:var(--chalk);transition:width .25s}
.sentence{font-family:var(--font-en);font-size:1.45rem;line-height:1.55;margin:6px 0 18px;text-wrap:pretty}
.blank{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--ink);text-align:center;color:var(--board-2);font-weight:700}
.ask{color:var(--muted);font-size:.9rem;margin:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font-family:var(--font-en);font-size:1.15rem}
.opt .key{flex:none;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:.85rem;font-weight:700;font-family:var(--font-body)}
.opt:hover:not(:disabled){border-color:var(--board-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;display:grid;gap:4px}
.feedback.ok{background:var(--ok-bg);color:var(--ink);border-left:5px solid var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--ink);border-left:5px solid var(--bad)}
.feedback .full{font-family:var(--font-en)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
/* result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-size:3.2rem;font-weight:900;color:var(--board);font-variant-numeric:tabular-nums;line-height:1}
:root[data-theme="dark"] .score .big{color:var(--chalk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .score .big{color:var(--chalk)}}
.wrong{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.wrong li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;background:var(--card)}
.wrong .s{font-family:var(--font-en)}
.wrong .a{font-size:.9rem;color:var(--muted)}
.wrong .a b{color:var(--ok)}
.wrong .a s{color:var(--bad)}
.hidden{display:none !important}
.board{margin-top:16px}
.board h2{margin:0;font-size:1.1rem}
.board table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th,.board td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.board th{font-size:.82rem;color:var(--muted);font-weight:700}
.board td.n,.board th.n{text-align:right}
.board .rk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:900}
.board tr.r1 .rk{background:var(--chalk);border-color:var(--chalk);color:#2a2410}
.board tr.r2 .rk{background:#d9dee0;border-color:#d9dee0;color:#1c2321}
.board tr.r3 .rk{background:#e8c7a6;border-color:#e8c7a6;color:#3a2410}
.board tr.me td{font-weight:700}
.board .empty{color:var(--muted);padding:12px 0}
.upload{padding:10px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upload.ok{border-color:var(--ok);background:var(--ok-bg)}
.upload.bad{border-color:var(--bad);background:var(--bad-bg)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:420px){.sentence{font-size:1.25rem}.opt{font-size:1.05rem}}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>永中904每日背英單</h1>
  <div class="today" id="todayLbl"></div>
</div></header>
<main><div class="wrap">

<section id="setup" class="panel" aria-label="測驗設定">
  <div class="field">
    <div class="label">學生資料</div>
    <div class="row">
      <label for="seat">座號</label><select id="seat"><option value="">請選擇</option></select>
      <label for="sname">姓名</label><input type="text" id="sname" maxlength="20" placeholder="請輸入姓名" style="min-width:140px;flex:0 1 180px">
    </div>
    <div class="hint">交卷後成績會自動上傳給老師。這台裝置會記住你的座號和姓名。</div>
  </div>
  <div class="field">
    <div class="label">選擇範圍</div>
    <div class="seg" role="group" aria-label="範圍方式">
      <button id="mRange" aria-pressed="true">連續天數</button>
      <button id="mPick" aria-pressed="false">指定天數</button>
    </div>
    <div class="quick">
      <button id="qToday">只考今天</button>
      <button id="qUpto">從 D183 考到今天</button>
      <button id="qWeek">最近 7 天</button>
    </div>
    <div class="rangeNow" id="rangeNow" aria-live="polite"></div>
  </div>

  <div id="rangeBox" class="field">
    <div class="row">
      <label for="from">從</label><select id="from"></select>
      <label for="to">到</label><select id="to"></select>
    </div>
  </div>

  <div id="pickBox" class="field hidden">
    <div class="row">
      <input type="text" id="pickText" placeholder="例如：183, 150, 100-95" aria-label="輸入天數">
      <button class="ghost" id="pickApply">套用</button>
      <button class="ghost" id="pickClear">清除</button>
    </div>
    <div class="daygrid" id="dayGrid" aria-label="點選天數"></div>
    <div class="hint">可以輸入天數（用逗號分開，「100-95」表示 D100 到 D95），或直接點選下方的天數。</div>
  </div>

  <div class="field">
    <div class="label">題型</div>
    <div class="seg" role="group" aria-label="題型">
      <button data-k="all" aria-pressed="true">全部</button>
      <button data-k="word" aria-pressed="false">單字選擇</button>
      <button data-k="verb" aria-pressed="false">動詞變化</button>
      <button data-k="prep" aria-pressed="false">介系詞搭配</button>
    </div>
  </div>

  <div class="field">
    <div class="label">題數</div>
    <div class="seg" role="group" aria-label="題數" id="numSeg">
      <button data-n="10" aria-pressed="false">10 題</button>
      <button data-n="20" aria-pressed="true">20 題</button>
      <button data-n="30" aria-pressed="false">30 題</button>
      <button data-n="50" aria-pressed="false">50 題</button>
      <button data-n="100" aria-pressed="false">100 題</button>
      <button data-n="0" aria-pressed="false">全部</button>
    </div>
  </div>

  <div class="summary">
    <div class="count" id="countLbl"></div>
    <button class="primary" id="startBtn">開始測驗</button>
  </div>
</section>

<section id="quiz" class="panel hidden" aria-live="polite">
  <div>
    <div class="qhead">
      <div class="row"><span class="chip" id="qDay"></span><span class="chip k" id="qKind"></span></div>
      <div class="hint" id="qProg"></div>
    </div>
    <div class="bar"><span id="qBar"></span></div>
    <p class="ask">＿＿＿ 處適合填入何者？</p>
    <div class="sentence" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div id="qFb" class="feedback hidden"></div>
    <div class="actions">
      <button class="ghost" id="quitBtn">結束測驗</button>
      <button class="primary hidden" id="nextBtn">下一題</button>
    </div>
  </div>
</section>

<section id="result" class="panel hidden">
  <div class="score"><span class="big" id="rScore"></span><span id="rDetail"></span></div>
  <div class="upload" id="rUpload" role="status"></div>
  <div id="rWrongBox" class="field">
    <div class="label">答錯的題目</div>
    <ul class="wrong" id="rWrong"></ul>
  </div>
  <div class="actions">
    <button class="ghost" id="backBtn">回到設定</button>
    <button class="ghost" id="redoWrong">只重做答錯的題目</button>
    <button class="primary" id="againBtn">同範圍再測一次</button>
  </div>
</section>

<section id="board" class="panel board" aria-label="排行榜">
  <div class="row" style="justify-content:space-between">
    <h2>排行榜・答對題數前 10 名</h2>
    <div class="seg" role="group" aria-label="期間">
      <button data-p="week" aria-pressed="true">本週</button>
      <button data-p="month" aria-pressed="false">本月</button>
      <button data-p="all" aria-pressed="false">全部</button>
    </div>
  </div>
  <div id="boardBody" class="empty">載入中…</div>
  <div class="hint">依答對題數加總排名，做越多、答對越多就越前面。每次交卷後會更新。</div>
</section>
</div></main>
<script>
let DATA = null;
let N = 183;
const lab = i => DATA.labels[i];
const dnum = i => parseInt(DATA.labels[i].slice(1), 10);
const idxOf = d => DATA.labels.indexOf('D' + d);
const START = new Date(2026, 10, 13);      // 2026-11-13 = D183
function todayIdx(){
  const t = new Date(); t.setHours(0,0,0,0);
  const k = Math.round((t - START) / 86400000);
  return Math.min(N - 1, Math.max(0, k));
}
const $ = id => document.getElementById(id);


let mode = 'range', kind = 'all', num = 20;
let picked = new Set();
let session = null;

function initSelects(){
  const f = $('from'), t = $('to');
  for (let i = 0; i < N; i++){
    const txt = `${lab(i)}｜${DATA.themes[i]}`;
    f.add(new Option(txt, i)); t.add(new Option(txt, i));
  }
  f.value = 0; t.value = todayIdx();
}
function initGrid(){
  const g = $('dayGrid');
  for (let i = 0; i < N; i++){
    const b = document.createElement('button');
    b.textContent = lab(i); b.dataset.i = i; b.setAttribute('aria-pressed','false');
    b.title = DATA.themes[i] + '：' + DATA.words[i].join(', ');
    b.onclick = () => { picked.has(i) ? picked.delete(i) : picked.add(i); syncGrid(); update(); };
    g.appendChild(b);
  }
}
function syncGrid(){
  $('dayGrid').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', picked.has(+b.dataset.i) ? 'true' : 'false'));
  const ds = [...picked].sort((a,b)=>a-b).map(dnum);
  $('pickText').value = ds.join(', ');
}
function parsePick(txt){
  const s = new Set();
  txt.replace(/[Dd]/g,'').split(/[,，、\s]+/).forEach(p => {
    if (!p) return;
    const m = p.match(/^(\d+)\s*[-~～]\s*(\d+)$/);
    if (m){ let a=+m[1], b=+m[2]; const lo=Math.min(a,b), hi=Math.max(a,b); for(let d=lo; d<=hi; d++){ const i=idxOf(d); if(i>=0) s.add(i);} }
    else { const i = idxOf(+p); if (i >= 0) s.add(i); }
  });
  return s;
}
function selectedDays(){
  if (mode === 'pick') return [...picked].sort((a,b)=>a-b);
  let a = +$('from').value, b = +$('to').value; if (a > b) [a,b] = [b,a];
  const out = []; for (let i = a; i <= b; i++) out.push(i); return out;
}
function pool(){
  const days = selectedDays(); const seen = new Set();
  const keys = new Set();
  days.forEach(i => DATA.days[i].forEach(qi => {
    const q = DATA.bank[qi];
    if ((kind === 'all' || q.k === kind) && !keys.has(q.g)) { keys.add(q.g); seen.add(qi); }
  }));
  session_days = new Set(days);
  return {days, items: [...seen]};
}
let session_days = new Set();
function update(){
  if (!DATA) return;
  syncQuick();
  const {days, items} = pool();
  const n = num === 0 ? items.length : Math.min(num, items.length);
  const words = days.reduce((s,i)=>s+DATA.words[i].length,0);
  $('countLbl').innerHTML = days.length
    ? `已選 <b>${days.length}</b> 天・${words} 個新字・題庫 <b>${items.length}</b> 題（每天 100 題，含複習題），本次出 <b>${n}</b> 題`
    : '還沒有選天數';
  const who = $('seat').value && $('sname').value.trim();
  $('startBtn').disabled = n === 0 || !who;
  $('startBtn').textContent = who ? '開始測驗' : '請先填座號和姓名';
}
function setMode(m){
  mode = m;
  $('mRange').setAttribute('aria-pressed', m==='range'); $('mPick').setAttribute('aria-pressed', m==='pick');
  $('rangeBox').classList.toggle('hidden', m!=='range'); $('pickBox').classList.toggle('hidden', m!=='pick');
  update();
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function start(items){
  session = {items, i:0, right:0, wrong:[], answered:false, order: items.map(qi => shuffle([0,1,2,3])),
    log: [], t0: Date.now(), planned: items.length, rangeText: rangeText()};
  $('setup').classList.add('hidden'); $('result').classList.add('hidden'); $('quiz').classList.remove('hidden'); $('board').classList.add('hidden');
  show();
}
function show(){
  const s = session, q = DATA.bank[s.items[s.i]];
  s.answered = false;
  $('qDay').textContent = lab(q.d);
  $('qKind').textContent = ({verb:'動詞變化', word:'單字選擇', prep:'介系詞搭配'})[q.k] + (session_days.has(q.d) ? '' : '・複習');
  $('qProg').textContent = `第 ${s.i+1} / ${s.items.length} 題・答對 ${s.right}`;
  $('qBar').style.width = (s.i / s.items.length * 100) + '%';
  $('qText').innerHTML = esc(q.a) + '<span class="blank">&nbsp;</span>' + esc(q.b);
  const box = $('qOpts'); box.innerHTML = '';
  s.order[s.i].forEach((oi, k) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.dataset.oi = oi;
    b.innerHTML = `<span class="key">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span>`;
    b.onclick = () => answer(oi);
    box.appendChild(b);
  });
  $('qFb').className = 'feedback hidden'; $('nextBtn').classList.add('hidden');
}
function answer(oi){
  const s = session; if (s.answered) return; s.answered = true;
  const q = DATA.bank[s.items[s.i]], ok = oi === q.c;
  if (ok) s.right++; else s.wrong.push({qi: s.items[s.i], pick: oi});
  s.log.push([s.items[s.i], oi]);
  $('qOpts').querySelectorAll('.opt').forEach(b => {
    const v = +b.dataset.oi; b.disabled = true;
    if (v === q.c) b.classList.add('ok'); else if (v === oi) b.classList.add('bad');
  });
  $('qText').querySelector('.blank').textContent = q.o[q.c];
  const fb = $('qFb');
  fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
  fb.innerHTML = `<b>${ok ? '答對了！' : '答錯了，正確答案是 ' + esc(q.o[q.c])}</b>` +
    (q.z ? `<span>${esc(q.z)}</span>` : '') + `<span class="hint">單字：${esc(q.w)}</span>`;
  $('qProg').textContent = `第 ${s.i+1} / ${s.items.length} 題・答對 ${s.right}`;
  const nb = $('nextBtn'); nb.textContent = s.i === s.items.length - 1 ? '看成績' : '下一題'; nb.classList.remove('hidden'); nb.focus();
}
function next(){
  const s = session; if (!s.answered) return;
  s.i++; if (s.i >= s.items.length) finish(); else show();
}
function finish(){
  const s = session, total = s.items.length;
  $('quiz').classList.add('hidden'); $('result').classList.remove('hidden'); $('board').classList.remove('hidden');
  $('rScore').textContent = Math.round(s.right / total * 100) + ' 分';
  $('rDetail').textContent = `答對 ${s.right} 題，共 ${total} 題`;
  const ul = $('rWrong'); ul.innerHTML = '';
  $('rWrongBox').classList.toggle('hidden', s.wrong.length === 0);
  $('redoWrong').classList.toggle('hidden', s.wrong.length === 0);
  s.wrong.forEach(w => {
    const q = DATA.bank[w.qi];
    const li = document.createElement('li');
    li.innerHTML = `<div class="s">${esc(q.a)}<b>${esc(q.o[q.c])}</b>${esc(q.b)}</div>` +
      `<div class="a">${lab(q.d)}・你選 <s>${esc(q.o[w.pick])}</s>，正確是 <b>${esc(q.o[q.c])}</b>${q.z ? '・' + esc(q.z) : ''}</div>`;
    ul.appendChild(li);
  });
  session.last = s.items;
  if (s.log.length) upload(); else { $('rUpload').className = 'upload'; $('rUpload').textContent = '沒有作答，不上傳成績。'; }
}
function rangeText(){
  const ds = selectedDays().map(dnum);
  if (!ds.length) return '';
  if (mode === 'range') return ds.length === 1 ? 'D' + ds[0] : `D${ds[0]}–D${ds[ds.length-1]}`;
  return ds.map(d => 'D' + d).join(', ').slice(0, 110);
}
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// wiring

$('pickApply').onclick = () => { picked = parsePick($('pickText').value); syncGrid(); update(); };
$('pickText').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('pickApply').click(); } });

function syncQuick(){
  const t = todayIdx(), a = Math.min(+$('from').value, +$('to').value), b = Math.max(+$('from').value, +$('to').value);
  const isR = mode === 'range';
  $('qToday').setAttribute('aria-pressed', isR && a === t && b === t);
  $('qUpto').setAttribute('aria-pressed', isR && a === 0 && b === t);
  $('qWeek').setAttribute('aria-pressed', isR && a === Math.max(0, t-6) && b === t);
  let txt;
  if (isR) txt = `目前範圍：<b>${lab(a)}${a !== b ? ' 到 ' + lab(b) : ''}</b>（${b - a + 1} 天）`;
  else txt = `目前範圍：已指定 <b>${picked.size}</b> 天`;
  if (t === 0) txt += '。今天是第一天，所以「只考今天」「從 D183 考到今天」「最近 7 天」範圍相同，之後天數變多就會不一樣。';
  else if (t < 6) txt += `。目前只過了 ${t + 1} 天，「最近 7 天」和「從 D183 考到今天」範圍相同。`;
  $('rangeNow').innerHTML = txt;
}
$('qToday').onclick = () => { const t = todayIdx(); setMode('range'); $('from').value = t; $('to').value = t; update(); };
$('qUpto').onclick = () => { setMode('range'); $('from').value = 0; $('to').value = todayIdx(); update(); };
$('qWeek').onclick = () => { const t = todayIdx(); setMode('range'); $('from').value = Math.max(0, t-6); $('to').value = t; update(); };
$('startBtn').onclick = () => {
  const {items} = pool(); shuffle(items);
  const n = num === 0 ? items.length : Math.min(num, items.length);
  start(items.slice(0, n));
};
$('nextBtn').onclick = next;
$('quitBtn').onclick = () => { if (session.i === 0 && !session.answered) { back(); return; } session.items = session.items.slice(0, session.i + (session.answered?1:0)); finish(); };
function back(){ $('quiz').classList.add('hidden'); $('result').classList.add('hidden'); $('setup').classList.remove('hidden'); $('board').classList.remove('hidden'); update(); }
$('backBtn').onclick = back;
$('redoWrong').onclick = () => { const rt = session.rangeText; start(shuffle(session.wrong.map(w => w.qi))); session.rangeText = (rt + '（錯題重做）').slice(0, 120); };
$('againBtn').onclick = () => $('startBtn').click();
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;
  const k = e.key.toUpperCase(); const map = {A:0,B:1,C:2,D:3,'1':0,'2':1,'3':2,'4':3};
  if (k in map && !session.answered){ const btn = $('qOpts').children[map[k]]; if (btn) btn.click(); }
  else if (e.key === 'Enter' && session.answered){ e.preventDefault(); next(); }
});

// Google Apps Script 網頁應用程式網址（部署後貼在這裡）
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwVEzwgfcPoXTAd9CSLp_ivkan_naUrSNBQog6tT_ggy8MlLX-AOsp3TySZnaCQ-9k2Ng/exec';

async function upload(){
  const s = session, box = $('rUpload');
  if (!SHEET_URL) { box.className = 'upload bad'; box.textContent = '老師尚未設定成績上傳網址，這次成績沒有上傳。'; return; }
  box.className = 'upload'; box.textContent = '成績上傳中…';
  const body = JSON.stringify({
    seat: $('seat').value, name: $('sname').value.trim(), range: s.rangeText, kind,
    total: s.planned, seconds: Math.round((Date.now() - s.t0) / 1000), answers: s.log
  });
  const okMsg = sc => `✓ 成績已上傳（${$('seat').value} 號 ${$('sname').value.trim()}${sc != null ? '，' + sc + ' 分' : ''}）`;
  try {
    const r = await fetch(SHEET_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '上傳失敗');
    box.className = 'upload ok'; box.textContent = okMsg(j.score);
    loadBoard();
  } catch (e) {
    if (e instanceof TypeError) {
      // 讀不到回應（瀏覽器限制）時，改用不讀回應的方式送出
      try {
        await fetch(SHEET_URL, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body});
        box.className = 'upload ok'; box.textContent = okMsg(null) + '，請老師在試算表確認';
        return;
      } catch (e2) {}
    }
    box.className = 'upload bad';
    box.innerHTML = `上傳失敗：${esc(e.message)}　<button class="ghost" id="retryUp">重新上傳</button>`;
    $('retryUp').onclick = upload;
  }
}

let boardPeriod = 'week';
async function loadBoard(){
  const body = $('boardBody');
  if (!SHEET_URL) { body.textContent = '尚未設定成績網址。'; return; }
  body.className = 'empty'; body.textContent = '載入中…';
  try {
    const r = await fetch(SHEET_URL + '?action=board&period=' + boardPeriod);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '');
    if (!j.top || !j.top.length) { body.textContent = '這段期間還沒有人交卷，搶第一名吧！'; return; }
    const me = +$('seat').value;
    body.className = '';
    body.innerHTML = '<table><thead><tr><th>名次</th><th>座號</th><th>姓名</th><th class="n">答對題數</th><th class="n">測驗次數</th><th class="n">答對率</th></tr></thead><tbody>' +
      j.top.map(x => `<tr class="r${x.rank}${x.seat === me ? ' me' : ''}"><td><span class="rk">${x.rank}</span></td><td>${x.seat}</td><td>${esc(x.name)}</td><td class="n">${x.right}</td><td class="n">${x.tests}</td><td class="n">${x.rate}%</td></tr>`).join('') +
      '</tbody></table>';
  } catch (e) { body.className = 'empty'; body.textContent = '排行榜暫時無法載入，請稍後再試。'; }
}
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
  boardPeriod = b.dataset.p;
  document.querySelectorAll('[data-p]').forEach(x => x.setAttribute('aria-pressed', x === b));
  loadBoard();
});
