<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>永中904每日背英單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* classroom blackboard + chalk: deep green board, chalk-yellow accent, paper surfaces */
  --board:#1f3d33; --board-2:#2a5245; --chalk:#f2c94c; --paper:#fbfaf6; --card:#ffffff;
  --ink:#1c2321; --muted:#5f6b67; --line:#dde3df;
  --ok:#1f8a4c; --ok-bg:#e5f5ec; --bad:#c2412d; --bad-bg:#fbe9e5;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-en:'Atkinson Hyperlegible','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#15291f; --board-2:#1f3b2f; --chalk:#f2c94c; --paper:#121715; --card:#1a201e;
    --ink:#e9eeec; --muted:#9aa8a3; --line:#2c3633; --ok:#4cc27e; --ok-bg:#16301f; --bad:#ef7a64; --bad-bg:#3a1c16; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --board:#15291f; --board-2:#1f3b2f; --chalk:#f2c94c; --paper:#121715; --card:#1a201e;
  --ink:#e9eeec; --muted:#9aa8a3; --line:#2c3633; --ok:#4cc27e; --ok-bg:#16301f; --bad:#ef7a64; --bad-bg:#3a1c16; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
header.top{background:var(--board);color:#f4f1e6;padding:18px 20px 16px}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.04em;text-wrap:balance}
header.top .today{font-size:.95rem;color:#d7dfd9}
header.top .today b{color:var(--chalk);font-size:1.15rem;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto}
main{padding:18px 16px 40px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:18px}
.field{display:grid;gap:8px}
.label{font-weight:700;font-size:.95rem}
.hint{color:var(--muted);font-size:.85rem}
.seg{justify-self:start;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--paper);flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--board);color:#fff}
.seg.multi button::before{content:'☐ ';opacity:.6}
.seg.multi button[aria-pressed="true"]::before{content:'☑ ';opacity:1}
.passage{font-family:var(--font-en);font-size:1.15rem;line-height:2;margin:6px 0 14px;text-wrap:pretty}
.cb{display:inline-block;min-width:4.2em;padding:0 6px;margin:0 2px;border-bottom:3px solid var(--line);text-align:center;color:var(--muted);font-weight:700;line-height:1.4}
.cb.cur{border-color:var(--chalk);background:#fff6d6;color:var(--ink)}
.cb.ok{border-color:var(--ok);color:var(--ok)}
.cb.bad{border-color:var(--bad);color:var(--bad)}
.cb.given{border-color:transparent;color:var(--ink);font-weight:600;min-width:0;padding:0 2px}
.cgloss{font-size:.88rem;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:-4px 0 14px;line-height:1.6}
.cgloss b{color:var(--ink);font-family:var(--font-en)}
.feedback .why{font-size:.95rem}
.feedback .trans{margin-top:6px;padding-top:8px;border-top:1px dashed var(--line);font-size:.95rem;line-height:1.7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);min-width:0}
input[type=text]{flex:1;min-width:200px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1px dashed var(--board-2);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;font-size:.9rem}
.quick button[aria-pressed="true"]{background:var(--chalk);border:1px solid var(--chalk);color:#2a2410;font-weight:700}
.rangeNow{font-size:.9rem;color:var(--muted)}
.rangeNow b{color:var(--ink);font-variant-numeric:tabular-nums}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;max-height:220px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.daygrid button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:4px 0;font-size:.85rem;font-variant-numeric:tabular-nums}
.daygrid button[aria-pressed="true"]{background:var(--chalk);border-color:var(--chalk);color:#2a2410;font-weight:700}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.summary .count{font-variant-numeric:tabular-nums}
.summary .count b{font-size:1.3rem}
.primary{background:var(--board);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:500}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chip{display:inline-block;background:var(--board);color:#fff;border-radius:6px;padding:2px 8px;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.chip.k{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:999px;margin-bottom:16px}
.bar span{display:block;position:relative;height:100%;background:var(--chalk);border-radius:999px;transition:width .25s;min-width:2px}
.bar span::after{content:'🚀';position:absolute;right:-8px;top:50%;transform:translateY(-54%);font-size:15px;line-height:1}
.sentence{font-family:var(--font-en);font-size:1.45rem;line-height:1.55;margin:6px 0 18px;text-wrap:pretty}
.sentence u.hl,#rWrong u.hl{text-decoration:none;background:linear-gradient(transparent 62%,#ffe08a 62%);font-weight:700;padding:0 2px}
.blank{display:inline-block;min-width:5.5em;border-bottom:3px solid var(--ink);text-align:center;color:var(--board-2);font-weight:700}
.ask{color:var(--muted);font-size:.9rem;margin:0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font-family:var(--font-en);font-size:1.15rem}
.opt .key{flex:none;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);font-size:.85rem;font-weight:700;font-family:var(--font-body)}
.opt:hover:not(:disabled){border-color:var(--board-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt .ow{display:flex;flex-direction:column;gap:2px}
.opt .oz{font-family:var(--font-body);font-size:.85rem;color:var(--muted);line-height:1.35}
.feedback .zh{font-size:1rem}
.feedback .more{display:block;margin-top:6px;padding:6px 10px;border-radius:10px;background:rgba(255,224,138,.35);font-size:.92rem;line-height:1.5;color:var(--ink)}
.feedback .more small{display:block;opacity:.75;font-size:.82rem}
.feedback .why{display:block;margin-top:6px;font-size:.98rem;font-weight:600;line-height:1.55}
.feedback .xp{margin-top:8px;padding-top:8px;border-top:1px dashed currentColor;font-size:.95rem;line-height:1.6;color:var(--ink,inherit)}
.feedback .xp p{margin:2px 0}
.feedback .xp .tip{font-weight:700}
.wrong .z{font-size:.9rem;margin-top:2px}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;display:grid;gap:4px}
.feedback.ok{background:var(--ok-bg);color:var(--ink);border-left:5px solid var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--ink);border-left:5px solid var(--bad)}
.feedback .full{font-family:var(--font-en)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
/* result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-size:3.2rem;font-weight:900;color:var(--board);font-variant-numeric:tabular-nums;line-height:1}
:root[data-theme="dark"] .score .big{color:var(--chalk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .score .big{color:var(--chalk)}}
.wrong{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.wrong li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:10px 12px;background:var(--card)}
.wrong .s{font-family:var(--font-en)}
.wrong .a{font-size:.9rem;color:var(--muted)}
.wrong .a b{color:var(--ok)}
.wrong .a s{color:var(--bad)}
.hidden{display:none !important}
.board{margin-top:16px}
.board h2{margin:0;font-size:1.1rem}
.board table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th,.board td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.board th{font-size:.82rem;color:var(--muted);font-weight:700}
.board td.n,.board th.n{text-align:right}
.board .rk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-weight:900}
.board tr.r1 .rk{background:var(--chalk);border-color:var(--chalk);color:#2a2410}
.board tr.r2 .rk{background:#d9dee0;border-color:#d9dee0;color:#1c2321}
.board tr.r3 .rk{background:#e8c7a6;border-color:#e8c7a6;color:#3a2410}
.board tr.me td{font-weight:700}
.board .empty{color:var(--muted);padding:12px 0}
.titles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 12px}
.ttl{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.ttl b{display:block;font-size:.8rem;color:var(--muted)}
.ttl .who{font-weight:900;font-size:1.02rem;margin:2px 0}
.ttl .val{font-size:.85rem;font-variant-numeric:tabular-nums}
.ttl small{display:block;color:var(--muted);font-size:.72rem;margin-top:2px;line-height:1.35}
.sortseg{margin-top:10px}
.board .up{color:var(--ok);font-weight:900}
.fame{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.fame h3{margin:0 0 6px;font-size:.95rem}
.fame ol{list-style:none;margin:0;padding:0}
.fame li{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.fame li .when{color:var(--muted);min-width:7.5em;font-variant-numeric:tabular-nums}
.fame li .who{font-weight:900;flex:1}
.fame li .v{color:var(--muted);font-size:.8rem;white-space:nowrap}
.fame li.me .who{color:var(--board)}
.ttl.mine{border-color:var(--chalk);box-shadow:0 0 0 1px var(--chalk) inset}
.upload{padding:10px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upload.ok{border-color:var(--ok);background:var(--ok-bg)}
.upload.bad{border-color:var(--bad);background:var(--bad-bg)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:420px){.sentence{font-size:1.25rem}.opt{font-size:1.05rem}}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}
.chip.streak{background:#fff3d6;color:#8a5a00;border:1px solid var(--chalk)}
#sndBtn{font:inherit;font-size:1rem;line-height:1;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
#sndBtn[aria-pressed="true"]{background:#fff3d6;border-color:var(--chalk)}
.spark{position:fixed;z-index:98;pointer-events:none;font-size:15px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-4vh;width:9px;height:14px;border-radius:2px;opacity:.95}
@media (prefers-reduced-motion: no-preference){
.opts .opt{animation:rise .25s ease-out backwards}
.opts .opt:nth-child(2){animation-delay:.05s}
.opts .opt:nth-child(3){animation-delay:.1s}
.opts .opt:nth-child(4){animation-delay:.15s}
.opt.ok{animation:okpop .45s cubic-bezier(.34,1.56,.64,1)}
.opt.bad{animation:shake .4s}
.feedback.ok,.feedback.bad{animation:rise .3s ease-out}
.chip.streak.pop{animation:okpop .4s cubic-bezier(.34,1.56,.64,1)}
.cb.now{display:inline-block;animation:stamp .45s cubic-bezier(.34,1.56,.64,1)}
.spark{animation:spark .8s ease-out forwards}
.confetti i{animation:fall linear forwards}
.score .big.bump{animation:okpop .5s cubic-bezier(.34,1.56,.64,1)}
}
@keyframes okpop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}45%{transform:translateX(6px)}70%{transform:translateX(-4px)}90%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes stamp{0%{transform:scale(1.9) rotate(-10deg);opacity:.1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{border:1px solid var(--chalk);background:#fff8e1;border-radius:999px;padding:4px 12px;font-size:.9rem}
.badge.new{border-color:var(--ok);background:#e7f6ec;font-weight:900}
.newbadge{color:var(--board);font-weight:900;margin-bottom:8px}
.newbadge:empty{display:none}
.bic{margin-left:5px;font-size:.82rem;letter-spacing:1px;white-space:nowrap}
.bic small{color:var(--muted);font-size:.72rem}
.bbook{margin-top:16px}
.bbook summary{cursor:pointer;color:var(--muted)}
.bkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px;margin-top:10px}
.bk{display:flex;gap:10px;align-items:center;border:1px solid var(--chalk);background:#fff8e1;border-radius:12px;padding:8px 10px}
.bk.off{opacity:.55;border-color:var(--line);background:var(--paper);filter:grayscale(1)}
.bk .bi{font-size:1.45rem}
.bk b{display:block;font-size:.9rem}
.bk small{color:var(--muted);font-size:.76rem;line-height:1.35;display:block}
.bk .got{margin-left:auto;color:var(--ok);font-weight:900}
@media (prefers-reduced-motion: no-preference){.badge.new{animation:okpop .5s cubic-bezier(.34,1.56,.64,1)}}
.taskban{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;border:2px solid var(--chalk);background:#fff8e1;border-radius:14px;padding:12px 14px;margin:0 0 18px}
.taskban .tb-text{display:flex;flex-direction:column;gap:2px;line-height:1.5}
.taskban .tb-text b{font-size:1.05rem}
#tbStat{font-weight:900}
#tbStat.ok{color:var(--ok)}
#tbStat.try{color:#9a6700}
.taskban.done{border-color:var(--ok);background:#e9f7ee}
.pinmsg{font-weight:900;font-size:.92rem}
svg.avatar{border-radius:50%;display:block;flex:none}
.mecard{display:flex;align-items:center;gap:14px;padding:10px 12px;margin:10px 0 4px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.meav{padding:0;border:0;background:none;cursor:pointer;border-radius:50%}
.meav svg.avatar{width:76px;height:76px;box-shadow:0 0 0 3px var(--chalk)}
.meinfo{flex:1;min-width:0}
.mename{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mename b{font-size:1.1rem}
.lv{background:var(--board);color:var(--chalk);font-weight:900;border-radius:999px;padding:0 9px;font-size:.85rem}
.mettl{color:var(--muted);font-size:.88rem;font-weight:700}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--chalk),#f29d4c);border-radius:5px;transition:width .8s}
.xptxt{font-size:.8rem;color:var(--muted)}
.ghostbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.qav svg.avatar{width:34px;height:34px}
.qav.jump svg{animation:avjump .5s}
@keyframes avjump{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
.avmodal{position:fixed;inset:0;background:rgba(10,20,16,.55);z-index:80;display:grid;place-items:center;padding:12px}
.avbox{background:var(--card);color:var(--ink);border-radius:18px;width:min(560px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.avtop{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.avtop svg.avatar{width:110px;height:110px}
.avtop>div:nth-child(2){flex:1}
.avx{border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--muted)}
.avtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 4px}
.avtabs button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font:inherit;font-size:.9rem;cursor:pointer;color:inherit}
.avtabs button[aria-selected="true"]{background:var(--board);color:#fff;border-color:var(--board)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;padding:10px 12px;overflow-y:auto}
.avgrid button{position:relative;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:6px 2px 4px;cursor:pointer;font:inherit;font-size:.78rem;color:inherit;display:flex;flex-direction:column;align-items:center;gap:2px}
.avgrid button[aria-pressed="true"]{border-color:var(--chalk);box-shadow:0 0 0 2px var(--chalk)}
.avgrid button:disabled{cursor:not-allowed}
.avgrid button:disabled>svg{opacity:.35;filter:grayscale(1)}
.avgrid .lock{position:absolute;top:22px;left:0;right:0;font-weight:900;font-size:.8rem}
.avgrid .sw{width:46px;height:46px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.avact{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.avact .hint{margin-right:auto}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:10px 0 6px}
.podium .pd{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:84px;text-align:center}
.podium .pd svg.avatar{width:64px;height:64px;box-shadow:0 0 0 3px #d9dee0}
.podium .pd.p1 svg.avatar{width:86px;height:86px;box-shadow:0 0 0 4px var(--chalk)}
.podium .pd.p3 svg.avatar{box-shadow:0 0 0 3px #e8c7a6}
.podium .pd b{font-size:.95rem}
.podium .pd small{color:var(--muted);font-size:.78rem}
.podium .medal{font-size:1.3rem;line-height:1}
.board td .nmav{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.board td .nmav svg.avatar{width:28px;height:28px}
.board .lvs{font-size:.72rem;font-weight:900;color:var(--muted);margin-left:2px}
.mebtns{display:flex;flex-direction:column;gap:6px}
.trcount{font-size:.8rem;color:var(--muted);margin-left:2px}
.avgrid .gem{position:absolute;top:2px;right:4px;font-size:.8rem}
.trgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px 12px;overflow-y:auto}
.tr{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--paper);text-align:left;font:inherit;color:inherit;cursor:pointer}
.tr.on{border-color:var(--chalk)}
.tr:disabled{cursor:default}
.tr:disabled svg{opacity:.3;filter:grayscale(1)}
.tr b{display:block;font-size:.88rem}
.tr small{display:block;font-size:.74rem;color:var(--muted);line-height:1.35}

<script src="avatar.js"></script>
<script>
let DATA = null, GL = {};
let N = 183;
const lab = i => DATA.labels[i];
const dnum = i => parseInt(DATA.labels[i].slice(1), 10);
const idxOf = d => DATA.labels.indexOf('D' + d);
const START = new Date(2026, 10, 13);      // 2026-11-13 = D183
function todayIdx(){
  const t = new Date(); t.setHours(0,0,0,0);
  const k = Math.round((t - START) / 86400000);
  return Math.min(N - 1, Math.max(0, k));
}
const $ = id => document.getElementById(id);


let mode = 'range', num = 20;
// 題型可複選；只有勾選的題型會出題
const KINDS = ['word', 'verb', 'prep', 'cloze', 'sense', 'phrase', 'cap'];
const EXTRA = new Set(['sense', 'phrase', 'cap']);   // 講義 Unit 2–4 的題目
const KIND_ZH = {verb: '動詞變化', word: '單字選擇', prep: '介系詞搭配', sense: '一字多義', phrase: '片語', cap: '會考文法'};
let types = new Set(KINDS);
try { const t = JSON.parse(localStorage.getItem('types') || 'null'); if (Array.isArray(t)) { types = new Set(t.filter(k => KINDS.includes(k))); if (!localStorage.getItem('types2')) EXTRA.forEach(k => types.add(k)); } } catch (e) {}
const kindCode = () => types.size === KINDS.length ? 'all' : KINDS.filter(k => types.has(k)).join('+');
// 克漏字：docs/cloze/index.json 列出各回篇數，作答時才載入該回的文章
const CLOZE = {units: {}, data: {}};
fetch('cloze/index.json').then(r => r.json()).then(j => { CLOZE.units = j.units || {}; update(); }).catch(() => {});
async function loadCloze(units){
  await Promise.all(units.filter(u => !CLOZE.data[u]).map(u => fetch('cloze/' + u + '.json').then(r => r.json()).then(j => { CLOZE.data[u] = j; })));
}
const clozeOf = st => CLOZE.data[st.u].passages[st.p];
let picked = new Set();
let session = null;

// 會考高頻字那段不顯示說明，其餘顯示主題
const theme = i => DATA.themes[i] === '會考高頻字' ? '' : DATA.themes[i];
function initSelects(){
  const f = $('from'), t = $('to');
  for (let i = 0; i < N; i++){
    const txt = lab(i) + (theme(i) ? '｜' + theme(i) : '');
    f.add(new Option(txt, i)); t.add(new Option(txt, i));
  }
  f.value = 0; t.value = todayIdx();
}
function initGrid(){
  const g = $('dayGrid');
  for (let i = 0; i < N; i++){
    const b = document.createElement('button');
    b.textContent = lab(i); b.dataset.i = i; b.setAttribute('aria-pressed','false');
    b.title = (theme(i) ? theme(i) + '：' : '') + DATA.words[i].join(', ');
    b.onclick = () => { picked.has(i) ? picked.delete(i) : picked.add(i); syncGrid(); update(); };
    g.appendChild(b);
  }
}
function syncGrid(){
  $('dayGrid').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', picked.has(+b.dataset.i) ? 'true' : 'false'));
  const ds = [...picked].sort((a,b)=>a-b).map(dnum);
  $('pickText').value = ds.join(', ');
}
function parsePick(txt){
  const s = new Set();
  txt.replace(/[Dd]/g,'').split(/[,，、\s]+/).forEach(p => {
    if (!p) return;
    const m = p.match(/^(\d+)\s*[-~～]\s*(\d+)$/);
    if (m){ let a=+m[1], b=+m[2]; const lo=Math.min(a,b), hi=Math.max(a,b); for(let d=lo; d<=hi; d++){ const i=idxOf(d); if(i>=0) s.add(i);} }
    else { const i = idxOf(+p); if (i >= 0) s.add(i); }
  });
  return s;
}
function selectedDays(){
  if (mode === 'pick') return [...picked].sort((a,b)=>a-b);
  let a = +$('from').value, b = +$('to').value; if (a > b) [a,b] = [b,a];
  const out = []; for (let i = a; i <= b; i++) out.push(i); return out;
}
function pool(){
  const days = selectedDays(); const all = new Set(); const keys = new Set();
  days.forEach(i => DATA.days[i].forEach(qi => {
    const q = DATA.bank[qi];
    if (types.has(q.k)) { all.add(qi); keys.add(q.g); }
  }));
  session_days = new Set(days);
  const passages = [];
  if (types.has('cloze')) days.forEach(i => { const u = DATA.labels[i]; for (let p = 0; p < (CLOZE.units[u] || 0); p++) passages.push({u, p}); });
  return {days, all: [...all], sentences: keys.size, passages};
}
// 每個句子只抽一個版本（隨機選一種誘答），同一次測驗不重複
// 講義題（一字多義／片語／會考文法）題數少，保底占約四分之一，不然很難抽到
function pickItems(all, n){
  const take = (list, m, keys, out) => { for (const qi of shuffle(list.slice())) { if (out.length >= m) break; const g = DATA.bank[qi].g; if (keys.has(g)) continue; keys.add(g); out.push(qi); } };
  const ex = all.filter(qi => EXTRA.has(DATA.bank[qi].k)), base = all.filter(qi => !EXTRA.has(DATA.bank[qi].k));
  const keys = new Set(), out = [];
  if (ex.length && base.length) take(ex, Math.max(1, Math.round(n / 4)), keys, out);
  take(base.length ? base : ex, n, keys, out);
  if (out.length < n) take(all, n, keys, out);
  return shuffle(out);
}
let session_days = new Set();
function update(){
  if (!DATA) return;
  syncQuick();
  const {days, sentences, passages} = pool();
  const n = sentences + passages.length * 5;
  let msg = '';
  if (!days.length) msg = '還沒有選天數';
  else if (!types.size) msg = '請至少勾選一種題型';
  else if (types.has('cloze') && !passages.length) msg = types.size === 1 ? '這個範圍還沒有克漏字文章，請換範圍或勾選其他題型。' : '這個範圍還沒有克漏字文章，這次只會出其他勾選的題型。';
  $('countLbl').textContent = msg;
  const who = $('seat').value && $('sname').value.trim() && PIN_OK;
  $('startBtn').disabled = n === 0 || !who;
  $('startBtn').textContent = who ? '開始測驗' : '請先填座號和密碼';
}
function setMode(m){
  mode = m;
  $('mRange').setAttribute('aria-pressed', m==='range'); $('mPick').setAttribute('aria-pressed', m==='pick');
  $('rangeBox').classList.toggle('hidden', m!=='range'); $('pickBox').classList.toggle('hidden', m!=='pick');
  update();
}
function gloss(q, i){ if (EXTRA.has(q.k)) return ''; const o = q.o[i]; return (q.k === 'verb' ? GL['v|' + q.w + '|' + o] : GL[o]) || ''; }
const br = t => esc(t).replace(/\n/g, '<br>');
// 句子：有畫線（一字多義／片語）就畫線，否則留空格
function qHTML(q, fill){
  if (q.m != null) return br(q.a) + `<u class="hl">${esc(q.m)}</u>` + br(q.b);
  return br(q.a) + (fill == null ? '<span class="blank">&nbsp;</span>' : `<span class="blank">${esc(fill)}</span>`) + br(q.b);
}
// 會考文法題詳解：為什麼選這個、其他選項錯在哪、口訣
const xpHTML = q => `<div class="xp"><p><b>為什麼選 ${esc(q.o[q.c])}：</b>${esc(q.x[0])}</p><p><b>其他選項：</b>${esc(q.x[1])}</p><p class="tip">📌 ${esc(q.x[2])}</p></div>`;
// 單字延伸：課本字義以外的其他意思（例如 just 還可以當形容詞「公正的」）
function moreHTML(q){
  const M = DATA.more || {}, w = String(q.w || '').toLowerCase().split(' (')[0];
  if (!M[w] || q.k === 'cap') return '';
  const base = GL[w];
  return `<span class="more">📚 <b>${esc(w)}</b> 還有這些意思：${esc(M[w])}${base ? `<small>課本：${esc(base)}</small>` : ''}</span>`;
}
const capTag = t => { const m = String(t || '').match(/^(\d+)(-補)?-(\d+)$/); return m ? `${m[1]} 年${m[2] ? '補考' : '會考'}第 ${m[3]} 題` : ''; };
// 同一個字（片語）在講義裡的所有意思
let SENSES = null;
function sensesOf(q){
  if (!SENSES) { SENSES = {}; DATA.bank.forEach(x => { if (x.k === 'sense' || x.k === 'phrase') { const k = x.k + '|' + x.w; (SENSES[k] = SENSES[k] || []).includes(x.o[x.c]) || SENSES[k].push(x.o[x.c]); } }); }
  return SENSES[q.k + '|' + q.w] || [];
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function start(items){
  $('qStreak').classList.add('hidden');

// 克漏字：整篇文章顯示，目前這一格標黃色，前面作答過的格子顯示學生選的字
function clozeHtml(st, reveal){
  const P = clozeOf(st), s = session;
  return esc(P.text).replace(/\{(\d)\}/g, (m, k) => {
    const b = +k - 1, B = P.blanks[b];
    if (b === st.b && !reveal) return `<span class="cb cur">(${k}) ＿＿</span>`;
    if (s.asked && !s.asked.has(st.u + '-' + st.p + '-' + b)) return `<span class="cb given">${esc(B.o[B.c])}</span>`;
    const done = s.done && s.done[st.u + '-' + st.p + '-' + b];
    if (b === st.b || done != null) { const pick = b === st.b ? reveal.pick : done; return `<span class="cb ${pick === B.c ? 'ok' : 'bad'}${b === st.b && reveal ? ' now' : ''}">(${k}) ${esc(B.o[B.c])}</span>`; }
    return `<span class="cb">(${k}) ＿＿</span>`;
  });
}

function rangeText(){
  const ds = selectedDays().map(dnum);
  if (!ds.length) return '';
  if (mode === 'range') return ds.length === 1 ? 'D' + ds[0] : `D${ds[0]}–D${ds[ds.length-1]}`;
  return ds.map(d => 'D' + d).join(', ').slice(0, 110);
}
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 互動效果：動畫、星星、連對徽章、彩紙與音效（音效預設關閉，🔊 按鈕開啟）
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const SND = {
  on: false, ctx: null,
  init(){ try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  tone(f, t0, dur, type, vol){ try {
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
    o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .13, t + .012); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.start(t); o.stop(t + dur + .05);
  } catch (e) {} },
  ok(streak){ if (!this.on) return; this.init(); this.tone(880, 0, .12); this.tone(1318.5, .08, .2);
    if (streak >= 5 && streak % 5 === 0) { this.tone(1568, .2, .12); this.tone(2093, .3, .3); } },
  bad(){ if (!this.on) return; this.init(); this.tone(220, 0, .2, 'triangle', .1); this.tone(185, .12, .25, 'triangle', .1); },
  win(perfect){ if (!this.on) return; this.init(); [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, i * .12, .28));
    if (perfect) [1318.5, 1568, 2093].forEach((f, i) => this.tone(f, .65 + i * .1, .32)); }
};
try { SND.on = localStorage.getItem('snd') === '1'; } catch (e) {}
const sndBtn = $('sndBtn');
function sndIcon(){ sndBtn.textContent = SND.on ? '🔊' : '🔇'; sndBtn.setAttribute('aria-pressed', SND.on); }
sndIcon();
sndBtn.onclick = () => { SND.on = !SND.on; sndIcon(); try { localStorage.setItem('snd', SND.on ? '1' : '0'); } catch (e) {} if (SND.on) { SND.init(); SND.tone(880, 0, .12); SND.tone(1318.5, .08, .18); } };
function burst(el){
  if (RM() || !el) return;
  const r = el.getBoundingClientRect(), em = ['✨', '⭐', '🌟', '💫'];
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('span'); p.className = 'spark'; p.textContent = em[i % 4];
    p.style.left = (r.left + Math.random() * r.width) + 'px';
    p.style.top = (r.top + r.height * .4) + 'px';
    p.style.setProperty('--dx', (Math.random() * 140 - 70) + 'px');
    p.style.setProperty('--dy', (-45 - Math.random() * 85) + 'px');
    document.body.appendChild(p); setTimeout(() => p.remove(), 900);
  }
}
function confetti(){
  if (RM()) return;
  const c = document.createElement('div'); c.className = 'confetti';
  const colors = ['#f2c94c', '#e4572e', '#2a7d63', '#4f8ef7', '#d957a9'];
  for (let i = 0; i < 60; i++) {
    const b = document.createElement('i');
    b.style.left = Math.random() * 100 + '%'; b.style.background = colors[i % 5];
    b.style.animationDelay = (Math.random() * .9) + 's';
    b.style.animationDuration = (1.8 + Math.random() * 1.5) + 's';
    b.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
    c.appendChild(b);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3800);
}
function fxAnswer(ok){
  const s = session;
  s.streak = ok ? (s.streak || 0) + 1 : 0;
  const b = $('qStreak');
  if (s.streak >= 2) {
    b.textContent = (s.streak >= 10 ? '🔥🔥🔥' : s.streak >= 5 ? '🔥🔥' : '🔥') + ' 連對 ' + s.streak + ' 題';
    b.classList.remove('hidden'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  } else b.classList.add('hidden');
  if (ok) { burst(document.querySelector('#qOpts .opt.ok')); SND.ok(s.streak); const q = $('qAv'); q.classList.remove('jump'); void q.offsetWidth; q.classList.add('jump'); } else SND.bad();

function countUp(el, to){
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  if (RM() || to <= 0) { el.textContent = to + ' 分'; return; }
  const t0 = performance.now(), dur = 700;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + ' 分';
    if (k < 1) requestAnimationFrame(step);

// 收集徽章：向成績程式要全班的徽章（從歷史成績即時算出）
let badgeData = null, badgeAt = 0, badgePromise = null;
function badgeDefs(){ const m = {}; (badgeData && badgeData.defs || []).forEach(d => { m[d.id] = d; }); return m; }
function fetchBadges(force){
  if (!SHEET_URL) return Promise.resolve(null);
  if (!force && badgeData && Date.now() - badgeAt < 60000) return Promise.resolve(badgeData);
  if (badgePromise) return badgePromise;
  badgePromise = fetch(SHEET_URL + '?action=badges').then(r => r.json()).then(j => {
    badgePromise = null;
    if (!j.ok || !j.defs) return badgeData;   // 舊版成績程式還沒有徽章功能
    badgeData = j; badgeAt = Date.now(); return j;
  }).catch(() => { badgePromise = null; return badgeData; });
  return badgePromise;
}
function bic(seat){
  if (!badgeData || !badgeData.badges) return '';
  const ids = badgeData.badges[seat] || [];
  if (!ids.length) return '';
  const defs = badgeDefs();
  const ic = ids.slice(-3).map(id => defs[id] ? defs[id].icon : '').join('');
  return `<span class="bic" title="${ids.length} 個徽章">${ic}${ids.length > 3 ? '<small>+' + (ids.length - 3) + '</small>' : ''}</span>`;
}
function drawBadgeBook(){
  if (!badgeData) return;
  const seat = $('seat').value, mine = (badgeData.badges && badgeData.badges[seat]) || [];
  $('badgeBookBody').innerHTML = badgeData.defs.map(d =>
    `<div class="bk${mine.includes(d.id) ? '' : ' off'}"><span class="bi">${d.icon}</span><div><b>${esc(d.name)}</b><small>${esc(d.desc)}</small></div>${mine.includes(d.id) ? '<span class="got">✓</span>' : ''}</div>`).join('');
  $('badgeBook').classList.remove('hidden');
}
async function renderBadges(){
  const j = await fetchBadges(true);
  if (!j) return;
  const seat = $('seat').value, mine = (j.badges && j.badges[seat]) || [];
  if (!mine.length) return;
  const defs = badgeDefs();
  let old = [];
  try { old = JSON.parse(localStorage.getItem('badges_' + seat) || '[]'); } catch (e) {}
  const fresh = mine.filter(id => !old.includes(id));
  try { localStorage.setItem('badges_' + seat, JSON.stringify(mine)); } catch (e) {}
  $('rBadges').innerHTML = mine.map(id => defs[id] ? `<span class="badge${fresh.includes(id) ? ' new' : ''}" title="${esc(defs[id].desc)}">${defs[id].icon} ${esc(defs[id].name)}</span>` : '').join('');
  $('rNew').textContent = fresh.length ? '🎉 獲得新徽章：' + fresh.map(id => defs[id] ? defs[id].icon + ' ' + defs[id].name : '').join('、') : '';
  if (fresh.length && !$('result').classList.contains('hidden')) { burst($('rNew')); SND.win(false); }
  $('rBadgesBox').classList.remove('hidden');
  if (typeof drawBoard === 'function' && boardData) drawBoard();   // 排行榜旁的徽章一起更新
}

// 今日任務：老師在試算表「每日任務」設定；範圍、題數要完全照任務才算數

    const j = await fetch(SHEET_URL + '?action=tasks&seat=' + seat).then(r => r.json());
    if (!j.ok || !j.task) { $('taskBan').classList.add('hidden'); TODAY_TASK = null; return; }
    TODAY_TASK = j.task;
    const t = j.task, me = j.me, lbl = t.label || (t.from + (t.from !== t.to ? '–' + t.to : ''));
    if (j.given && !TEACHERS[seat]) { $('sname').value = j.given; saveStudent(); update(); }
    const lbl2 = t.days ? lbl : '老師公布的範圍（請先在下面選好範圍）';
    $('tbRule').textContent = (t.quiz ? '📝 每日小考・' : '') + `範圍 ${lbl2}・${t.n} 題・答對率 ${t.pass}% 過關（可以重複考）`;
    $('tbPw').classList.toggle('hidden', !t.quiz);
    if (t.quiz && !$('tbPw').value) { try { $('tbPw').value = localStorage.getItem(pwKey(t.date)) || ''; } catch (e) {} }
    const st = $('tbStat');
    const warn = me && me.wrong ? `⚠️ 你剛剛考的是 ${me.wrong.range}，${t.days ? '不是今日任務範圍' : '和大部分同學不一樣，範圍可能選錯了'}，不算數喔！請確認範圍後重考。`

    if (me && me.passAt) { st.className = 'ok'; st.textContent = `✅ 已過關（${me.passAt.slice(11, 16)}，最高 ${me.best}%）`; }
    else if (me && me.attempts) { st.className = 'try'; st.textContent = `目前最高 ${me.best}%，再試一次！（已考 ${me.attempts} 次）` + (warn ? ' ' + warn : ''); }
    else if (warn) { st.className = 'try'; st.textContent = warn; }

// 組題：克漏字依勾選題型數平均分配題數（以 5 格為一篇），其餘由句子題補足；整篇的 5 格連在一起
// 每日小考：不管學生勾了哪些題型，固定這樣出（以 20 題為例）——
//   單字書 80%＝16 題：克漏字整篇 1 篇（5 格，也是考當天的單字）＋單字選擇／動詞變化／介系詞搭配 11 題
//   講義題（一字多義／片語／會考文法）20%＝4 題
const QUIZ_BASE = 0.8, QUIZ_CLOZE = 5;
async function startQuiz(){
  const saved = types; types = new Set(KINDS);
  const {all, passages} = pool();
  types = saved;
  const n = num;
  const base = all.filter(qi => !EXTRA.has(DATA.bank[qi].k)), ex = all.filter(qi => EXTRA.has(DATA.bank[qi].k));
  let nC = passages.length ? QUIZ_CLOZE : 0, nE = Math.min(n - Math.round(n * QUIZ_BASE), ex.length);
  let nB = Math.max(0, n - nC - nE);
  let pick = null;
  if (nC) {
    pick = shuffle(passages.slice())[0];
    $('startBtn').disabled = true; $('startBtn').textContent = '載入克漏字…';
    try { await loadCloze([pick.u]); } catch (e) { pick = null; nC = 0; nB = n - nE; }
  }
  // 講義題盡量挑不同題型
  const exPick = [], seen = new Set();
  for (const qi of shuffle(ex.slice())) { if (exPick.length >= nE) break; const k = DATA.bank[qi].k; if (seen.has(k) && ex.some(x => !seen.has(DATA.bank[x].k))) continue; seen.add(k); exPick.push(qi); }
  const take = (list, m, keys) => { const out = []; for (const qi of shuffle(list.slice())) { if (out.length >= m) break; const g = DATA.bank[qi].g; if (keys.has(g)) continue; keys.add(g); out.push(qi); } return out; };
  const keys = new Set(exPick.map(qi => DATA.bank[qi].g));
  // 單字書三種題型平均分（介系詞題比較少，有多少出多少，不足的由其他兩種補）
  const want = Math.min(nB, n - nC - exPick.length), per = Math.floor(want / 3);
  let basePick = [];
  ['word', 'verb', 'prep'].forEach((k, i) => { basePick = basePick.concat(take(base.filter(qi => DATA.bank[qi].k === k), per + (i < want % 3 ? 1 : 0), keys)); });
  if (basePick.length < want) basePick = basePick.concat(take(base, want - basePick.length, keys));
  if (basePick.length + exPick.length + nC < n) basePick = basePick.concat(take(all, n - nC - exPick.length - basePick.length, keys));
  const blocks = basePick.concat(exPick).map(qi => [qi]);
  if (pick) {
    const bs = shuffle(clozeOf(pick).blanks.map((_, b) => b)).slice(0, nC).sort((a, b) => a - b);
    blocks.push(bs.map(b => ({u: pick.u, p: pick.p, b})));
  }
  start(shuffle(blocks).flat());
  update();
}
$('startBtn').onclick = async () => {
  if (pendingQuiz) return startQuiz();
  const {all, sentences, passages} = pool();
  const sentTypes = KINDS.filter(k => k !== 'cloze' && types.has(k)).length;
  let nP = 0;
  if (passages.length) nP = sentTypes && sentences ? Math.max(1, Math.round(num / (sentTypes + 1) / 5)) : Math.max(1, Math.round(num / 5));
  nP = Math.min(nP, passages.length);
  const picks = shuffle(passages.slice()).slice(0, nP);
  if (picks.length) {
    $('startBtn').disabled = true; $('startBtn').textContent = '載入克漏字…';

  }
  const sentN = Math.max(0, Math.min(sentences, num - nP * 5));
  const blocks = pickItems(all, sentN).map(qi => [qi]);
  picks.forEach(x => blocks.push(clozeOf({u: x.u, p: x.p}).blanks.map((_, b) => ({u: x.u, p: x.p, b}))));
  start(shuffle(blocks).flat());
  update();
};

    if (!j.ok) throw new Error(j.error || '購買失敗');
    ME.coin = j.coin; ME.own = j.own; SHOP_SURE = '';
    AVSEL[cat] = id;
    const it = AV.map[cat][id];
    $('avMsg').textContent = `🎉 買到「${it.name}」了！按「儲存」就會穿上`;
    try { SND.ok(8); } catch (e) {}

    drawMe(); openAvTab();
  } catch (e) { SHOP_SURE = ''; $('avMsg').textContent = '⚠️ ' + e.message; drawShop(); }
}
async function saveAv(){

  if (bad) { $('avMsg').textContent = `⚠️ 「${AV.map[bad.key][AVSEL[bad.key]].name}」還沒擁有，先買下來或換掉再儲存`; return false; }
  try {

      body: JSON.stringify({type: 'avatar', seat: $('seat').value, pin: $('spin').value.trim(), avatar: AVSEL})});

}
$('avSave').onclick = async () => {

$('meTr').onclick = openTr;

// 個人密碼：老師在試算表「名單」設定；輸入對了才能開始、上傳
var PIN_OK = false;
let pinSeq = 0;
function pinMsg(t, c){ $('pinMsg').textContent = t; $('pinMsg').className = 'pinmsg ' + (c || ''); }
async function checkPin(quiet){
  const seat = $('seat').value, pin = $('spin').value.trim(), my = ++pinSeq;
  if (!quiet) { PIN_OK = false; update(); }
  if (!seat || !pin) { pinMsg(''); return; }
  if (!SHEET_URL) { PIN_OK = true; update(); return; }
  if (!quiet) pinMsg('確認中…');
  try {
    const j = await fetch(SHEET_URL + '?action=login&seat=' + seat + '&pin=' + encodeURIComponent(pin)).then(r => r.json());
    if (my !== pinSeq) return;
    if (j.ok) { PIN_OK = true; pinMsg('✓', 'ok'); if (j.given && !TEACHERS[seat]) $('sname').value = j.given; loadProfile(); if (boardData) loadBoard(); }
    else { PIN_OK = false; pinMsg(j.error || '密碼不對', 'bad'); }
  } catch (e) { if (my === pinSeq) { PIN_OK = true; pinMsg(''); } }   // 網路不穩時先讓他考，交卷時伺服器會再檢查
  saveStudent(); update();
}
// 打字時不檢查（避免打到一半被算成錯誤），按「確認」、Enter 或離開欄位才檢查
let lastTried = '';
function tryPin(){ const v = $('spin').value.trim(); if (!v || PIN_OK || v === lastTried) return; lastTried = v; checkPin(); }
$('spin').oninput = () => { PIN_OK = false; lastTried = ''; update(); pinMsg($('spin').value ? '打完按「確認」' : ''); };
$('spin').onchange = tryPin;
$('spin').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); tryPin(); } };
$('pinBtn').onclick = () => { lastTried = ''; tryPin(); };
$('logoutBtn').onclick = () => { ME = null; $('meCard').classList.add('hidden'); $('qAv').innerHTML = ''; $('seat').value = ''; $('sname').value = ''; $('spin').value = ''; PIN_OK = false; pinMsg(''); try { localStorage.removeItem('student'); } catch (e) {} $('taskBan').classList.add('hidden'); update(); if (typeof drawBoard === 'function') drawBoard(); };
// 選座號就從「名單」帶入名字；名單上沒有的座號（30 號測試）才自己輸入
async function fillName(){
  const seat = $('seat').value;
  if (!seat) { $('sname').value = ''; $('sname').readOnly = true; return; }
  if (TEACHERS[seat]) { $('sname').value = TEACHERS[seat]; $('sname').readOnly = true; return; }
  $('sname').value = ''; $('sname').placeholder = '讀取中…'; update();
  try {
    const j = await fetch(SHEET_URL + '?action=who&seat=' + seat).then(r => r.json());
    if (seat !== $('seat').value) return;
    $('sname').value = j.given || ''; $('sname').readOnly = !!j.given;
  } catch (e) { $('sname').readOnly = false; }
  $('sname').placeholder = $('sname').readOnly ? '選座號後自動帶入' : '請輸入姓名';
  saveStudent(); update();
}
$('seat').onchange = () => { ME = null; $('meCard').classList.add('hidden'); $('qAv').innerHTML = ''; $('spin').value = ''; PIN_OK = false; pinMsg(''); fillName(); setTimeout(loadTodayTask, 0); saveStudent(); update(); if (typeof drawBoard === 'function') drawBoard(); };
$('sname').oninput = () => { saveStudent(); update(); };

// Google Apps Script 網頁應用程式網址（部署後貼在這裡）
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxVmbIvH50EIkAU283p-MCnfhSmSvT_dsNoOeQFE-9og2788WmtwD9MBYwVMQJoD9fNaQ/exec';

async function upload(){
  const s = session, box = $('rUpload');
  if (!SHEET_URL) { box.className = 'upload bad'; box.textContent = '老師尚未設定成績上傳網址，這次成績沒有上傳。'; return; }
  box.className = 'upload'; box.textContent = '成績上傳中…';
  const body = JSON.stringify({
    seat: $('seat').value, name: $('sname').value.trim(), pin: $('spin').value.trim(), range: s.rangeText, kind: s.quiz ? 'all' : kindCode(),
    total: s.planned, seconds: Math.round((Date.now() - s.t0) / 1000), answers: s.log, quiz: s.quiz || ''
  });
  const okMsg = sc => `✓ 成績已上傳（${TEACHERS[$('seat').value] ? '' : $('seat').value + ' 號 '}${$('sname').value.trim()}${sc != null ? '，' + sc + ' 分' : ''}）`;
  try {
    const r = await fetch(SHEET_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '上傳失敗');
    if (j.quiz === false) { box.className = 'upload bad'; box.textContent = okMsg(j.score) + '，但小考密碼不對（或已過了當天），這次沒有算成每日小考。'; }
    else { box.className = 'upload ok'; box.textContent = okMsg(j.score) + (j.quiz ? '・📝 已記錄為每日小考' : ''); }
    setTimeout(() => loadProfile(true), 400);
    loadBoard();
  } catch (e) {
    if (e instanceof TypeError) {
      // 讀不到回應（瀏覽器限制）時，改用不讀回應的方式送出
      try {
        await fetch(SHEET_URL, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body});
        box.className = 'upload ok'; box.textContent = okMsg(null) + '，請老師在試算表確認';
        return;
      } catch (e2) {}
    }
    box.className = 'upload bad';
    box.innerHTML = `上傳失敗：${esc(e.message)}　<button class="ghost" id="retryUp">重新上傳</button>`;
    $('retryUp').onclick = upload;
  }
}

// 只留名字、去掉姓氏（複姓去兩字）；英文或其他寫法照原樣
function givenName(n) {
  n = String(n || '').trim();
  if (!/^[\u4e00-\u9fff]{2,5}$/.test(n)) return n;
  const two = ['歐陽', '司馬', '諸葛', '上官', '張簡', '范姜', '端木', '皇甫', '司徒', '東方', '公孫', '令狐', '夏侯', '慕容', '尉遲', '長孫', '宇文', '軒轅', '單于', '呼延'];
  const cut = (n.length >= 4 || (n.length === 3 && two.indexOf(n.slice(0, 2)) >= 0)) ? 2 : 1;
  return n.slice(cut) || n;
}
let boardPeriod = 'week', boardSort = 'right', boardType = 'all', boardData = null;
const TYPE_ZH = {all: '', word: '單字題', verb: '動詞變化題', prep: '介系詞題', cloze: '克漏字', sense: '一字多義', phrase: '片語', cap: '會考文法'};
const PERIOD_ZH = {day: '今天', week: '本週', month: '本月', all: '開學以來'};
const PREV_ZH = {day: '昨天', week: '上週', month: '上個月'};
async function loadBoard(){
  const body = $('boardBody');
  if (!SHEET_URL) { body.textContent = '尚未設定成績網址。'; return; }
  body.className = 'empty'; body.textContent = '載入中…';
  try {
    const mine = PIN_OK && $('seat').value && $('spin').value.trim() ? '&seat=' + $('seat').value + '&pin=' + encodeURIComponent($('spin').value.trim()) : '';
    const r = await fetch(SHEET_URL + '?action=board&period=' + boardPeriod + '&type=' + boardType + mine);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '');
    boardData = j; drawBoard();
    fetchBadges().then(j2 => { if (j2) drawBoard(); });
  } catch (e) { boardData = null; body.className = 'empty'; body.textContent = '排行榜暫時無法載入，請稍後再試。'; $('boardHint').textContent = ''; $('fameBody').innerHTML = ''; }
}
function drawBoard(){
  const j = boardData, body = $('boardBody'), me = +$('seat').value;
  if (!j) return;
  const boards = j.boards || {right: j.top || []};
  const tz = TYPE_ZH[j.type || 'all'] || '';
  if (boardPeriod === 'all' && boardSort === 'up') boardSort = 'right';
  document.querySelectorAll('[data-s]').forEach(x => {
    x.setAttribute('aria-pressed', x.dataset.s === boardSort);
    x.hidden = (x.dataset.s === 'up' && boardPeriod === 'all') || (x.dataset.s !== 'right' && !j.boards);
  });
  const icon = {strong: '👑', sharp: '🎯', up: '📈', busy: '📅', streak: '🔥'};
  const titles = (j.titles || []).map(t => `<div class="ttl${t.who.some(w => w.seat === me) ? ' mine' : ''}"><b>${icon[t.key] || '🏅'} ${esc(t.label)}</b><div class="who">${t.who.map(w => esc(TEACHERS[w.seat] || w.given)).join('、')}</div><div class="val">${esc(t.value)}</div><small>${esc(t.desc)}</small></div>`).join('');
  const list = boards[boardSort] || [];
  const nm = x => esc(TEACHERS[x.seat] || (x.given ?? givenName(x.name)));
  const pct = v => v == null ? '—' : v + '%';
  const cols = {
    right: ['<th class="n">答對</th><th class="n">作答題數</th><th class="n">答對率</th><th class="n opt">測驗次數</th>', x => `<td class="n">${x.right}</td><td class="n">${x.answered ?? '—'}</td><td class="n">${pct(x.rate)}</td><td class="n opt">${x.tests}</td>`],
    rate: ['<th class="n">答對率</th><th class="n">作答題數</th>', x => `<td class="n">${pct(x.rate)}</td><td class="n">${x.fAns}</td>`],
    up: [`<th class="n">進步</th><th class="n">${PREV_ZH[boardPeriod] || '上期'}</th><th class="n">${PERIOD_ZH[boardPeriod]}</th>`, x => `<td class="n up">+${x.up}</td><td class="n">${pct(x.prevRate)}</td><td class="n">${pct(x.rate)}</td>`]
  }[boardSort];
  const empty = {right: '這段期間還沒有人交卷，搶第一名吧！', rate: `還沒有人作答滿 ${j.min ? j.min.rate : ''} 題，多做幾回就能上榜！`, up: `還沒有人比${PREV_ZH[boardPeriod] || '上期'}進步（兩段都要作答滿 ${j.min && j.min.up || ''} 題才算）。`}[boardSort];
  const AVM = j.av || {}, avOf = seat => (window.AV && AV.items) ? AV.svg((AVM[seat] || {}).a, {size: 28}) : '';
  const lvOf = seat => AVM[seat] ? `<span class="lvs">Lv.${AVM[seat].lv}</span>` : '';
  const top3 = list.filter(x => x.rank <= 3).slice(0, 3);
  const podium = top3.length && window.AV && AV.items ? `<div class="podium">${[top3[1], top3[0], top3[2]].filter(Boolean).map(x => `<div class="pd p${x.rank}"><span class="medal">${['🥇', '🥈', '🥉'][x.rank - 1]}</span>${AV.svg((AVM[x.seat] || {}).a, {size: x.rank === 1 ? 86 : 64})}<b>${nm(x)}</b><small>${AVM[x.seat] ? 'Lv.' + AVM[x.seat].lv + '・' : ''}${boardSort === 'right' ? '答對 ' + x.right + (x.answered != null ? '／' + x.answered + ' 題' : ' 題') : boardSort === 'rate' ? pct(x.rate) : '+' + x.up}</small></div>`).join('')}</div>` : '';
  // 我自己的這段期間成績（沒上榜也看得到）
  const M = j.me && j.me.seat === me ? j.me : null;
  const myBox = M ? `<div class="mybox">${window.AV && AV.items ? AV.svg((AVM[me] || {}).a, {size: 40}) : ''}<div><b>我${PERIOD_ZH[boardPeriod] ? '（' + PERIOD_ZH[boardPeriod] + (tz ? '・' + tz : '') + '）' : ''}</b><div>作答 <b>${M.answered}</b> 題・答對 <b>${M.right}</b> 題・答對率 ${pct(M.rate)}・交卷 ${M.tests} 次</div><small>${M.rank ? `答對題數排第 ${M.rank} 名（共 ${M.total} 人）` : '這段期間還沒交卷，做一回就能上榜！'}</small></div></div>` : '';
  const inList = list.some(x => x.seat === me);
  body.className = '';
  body.innerHTML = (titles ? `<div class="titles">${titles}</div>` : '') + myBox + podium + (list.length
    ? `<table><thead><tr><th>名次</th><th>座號</th><th>名字</th>${cols[0]}</tr></thead><tbody>` +
      list.map(x => `<tr class="r${x.rank}${x.seat === me ? ' me' : ''}"><td><span class="rk">${x.rank}</span></td><td>${seatLabel(x.seat)}</td><td><span class="nmav">${avOf(x.seat)}<span>${nm(x)}${lvOf(x.seat)}</span></span>${bic(x.seat)}</td>${cols[1](x)}</tr>`).join('') +
      (boardSort === 'right' && M && !inList && M.rank ? `<tr class="gap"><td colspan="${cols[0].split('<th').length + 2}">⋯</td></tr><tr class="me"><td><span class="rk">${M.rank}</span></td><td>${seatLabel(me)}</td><td><span class="nmav">${avOf(me)}<span>我${lvOf(me)}</span></span>${bic(me)}</td>${cols[1](M)}</tr>` : '') + '</tbody></table>'
    : `<div class="empty">${empty}</div>`);
  $('boardHint').textContent = {
    right: `依${PERIOD_ZH[boardPeriod]}${tz}答對題數加總排名，做越多、答對越多就越前面。`,
    rate: `依${PERIOD_ZH[boardPeriod]}${tz}答對率排名，至少作答 ${j.min ? j.min.rate : ''} 題才上榜；不含錯題重做。`,
    up: `${PERIOD_ZH[boardPeriod]}${tz}的答對率比${PREV_ZH[boardPeriod] || '上期'}進步多少分；兩段都要作答滿 ${j.min && j.min.up || ''} 題，不含錯題重做。`
  }[boardSort] + '每次交卷後會更新。' + (tz ? '各題型排行從 11/15 開始累積。' : '');
  const f = j.fame;
  const famed = (rows, title) => rows && rows.length ? `<div><h3>${title}</h3><ol>${rows.map(r => `<li class="${r.who.some(w => w.seat === me) ? 'me' : ''}"><span class="when">${esc(r.label)}${r.current ? '（進行中）' : ''}</span><span class="who">${r.who.map(w => esc(TEACHERS[w.seat] || w.given)).join('、')}</span><span class="v">${esc(r.value)}</span></li>`).join('')}</ol></div>` : '';
  $('fameBody').innerHTML = f ? `<div class="fame">${famed(f.weeks, '🏆 歷屆週冠王（不含克漏字）')}${famed(f.months, '🏆 歷屆月冠王（不含克漏字）')}</div>` : '';
  drawBadgeBook();
}
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
  boardPeriod = b.dataset.p;
  document.querySelectorAll('[data-p]').forEach(x => x.setAttribute('aria-pressed', x === b));
  loadBoard();
});
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { boardSort = b.dataset.s; drawBoard(); });
document.querySelectorAll('[data-bt]').forEach(b => b.onclick = () => {
  boardType = b.dataset.bt;
  document.querySelectorAll('[data-bt]').forEach(x => x.setAttribute('aria-pressed', x === b));
  loadBoard();
});
loadBoard();

  setTimeout(loadTodayTask, 0);
